# UFLO Core Configuration Properties

# Enable UFLO
uflo.enabled=true

# Business hour settings
uflo.businessDayHours=8

# ID generation
uflo.idBlockSize=5000

# Job scheduler
uflo.jobThreadCount=2
uflo.makeSchedulerThreadDaemon=true
uflo.enableScanReminderJob=true
uflo.disableScheduler=false

# Cluster settings
uflo.clusterInstanceNames=

# Assignee providers
uflo.disabledUserAssigneeProvider=false
uflo.disabledDeptAssigneeProvider=false